[package]
name = "collector"
version = "0.1.0"
edition = "2024"

[dependencies]
url = "2.5"
http = "1.4"
bytes = "1.12"
rustls = "0.23"
jiff = "0.2.32"
itoa = "1.0.18"
tracing = "0.1.44"
anyhow = "1.0.103"
thiserror = "2.0.18"
tokio-rustls = "0.26"
webpki-roots = "1.0"
http-body-util = "0.1"
futures-util = "0.3.32"
hyper = { version = "1.10", features = ["client", "http1"] }
tokio = { version = "1.52", features = ["full"] }
reqwest = "0.13"
clap = { version = "4.6.2", features = ["derive"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
zstd = "0.13"
libc = "0.2.189"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing-subscriber = { version = "0.3.23", features = [] }
fastwebsockets = { version = "0.10.0", features = ["upgrade", "unstable-split"] }

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
strip = true
panic = "abort"
incremental = false
codegen-units = 1

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
